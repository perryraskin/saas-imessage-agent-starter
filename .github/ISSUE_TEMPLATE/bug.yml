name: Bug report
description: Report a reproducible problem in the starter
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private message transcripts, phone numbers, customer data, or signed URLs. Report vulnerabilities privately through GitHub Security Advisories."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior using sanitized examples.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest safe sequence and relevant configuration names without values.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options: [Simulator, Linq transport, Workflow, Eve agent, SaaS adapter, Tool/action, PostHog analytics, Handoff/OG preview, Testing, Documentation]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets and private/customer data.
          required: true
