version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      vercel-agent-stack:
        patterns: ["eve", "ai", "@ai-sdk/*", "workflow", "@vercel/*", "next"]
      posthog:
        patterns: ["@posthog/*", "posthog-*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
